overlay: 1.0.0
info:
  title: API Evangelist enhancements for the Qorevia Market Intelligence OpenAPI
  version: 1.0.0
  x-generated: '2026-09-19'
  x-method: generated
  x-source: openapi/flowhomes-eu-openapi.json
  x-description: >-
    Non-destructive overlay over the provider's OpenAPI 3.1.0 (2.0.0). Adds operationIds to the 21
    discovery/router/club paths the provider left unnamed (derived from method + path), tags them so
    the free surface is distinguishable from the 13 paid operations, and records the observed x402 gate
    as a documented (non-standard) security note in info.description. The original file is untouched.
extends: ./openapi/flowhomes-eu-openapi.json
actions:
- target: $.info
  update:
    contact: {url: 'https://api.flowhomes.eu/skill.md'}
    x-apievangelist-note: >-
      No securitySchemes are declared and none apply: the 13 operations carrying x-payment-info return
      HTTP 402 with a PAYMENT-REQUIRED header (x402 v2, USDC on Base) until the request is retried with
      PAYMENT-SIGNATURE; every other path is free. See conventions/flowhomes-eu-conventions.yml.
- target: $.tags
  update:
  - {name: finance, description: Paid market, risk and trading tools (x402)}
  - {name: data, description: Paid local data-profiling tools (x402)}
  - {name: developer-tools, description: Paid developer utilities (x402)}
  - {name: discovery, description: Free finder, router, catalog and preview routes}
  - {name: beacon, description: Free machine-readable vendor discovery documents}
  - {name: founders-network, description: Free Founders Network (club) routes}
  - {name: agent-protocols, description: MCP and A2A JSON-RPC endpoints}
- target: $.paths['/api/find'].get
  update: {operationId: find_tool, tags: [discovery]}
- target: $.paths['/api/route'].post
  update: {operationId: route_tool, tags: [discovery]}
- target: $.paths['/api/catalog'].get
  update: {operationId: list_catalog, tags: [discovery]}
- target: $.paths['/api/try'].get
