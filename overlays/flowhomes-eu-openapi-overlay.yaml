- target: $.paths['/mcp'].post
  update: {operationId: mcp_jsonrpc, tags: [agent-protocols]}
- target: $.paths['/a2a'].post
  update: {operationId: a2a_jsonrpc, tags: [agent-protocols]}
- target: $.paths['/.well-known/qorevia-router.json'].get
