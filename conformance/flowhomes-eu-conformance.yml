standards:
- id: x402-v2
  conforms: true
  evidence: >-
    GET https://api.flowhomes.eu/api/session-state with no payment -> HTTP 402, cache-control no-store,
    body {} and a PAYMENT-REQUIRED header whose base64 payload decodes to {x402Version: 2, error:
    "Payment required", resource {url, description, mimeType}, accepts[{scheme exact, network
    eip155:8453, amount "5000", asset 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913 (USDC on Base), payTo
    0x80cdA9077d65Ac1a05454619Bb94B318cf0c3382, maxTimeoutSeconds 300, extra {name "USD Coin", version
    "2"}}], extensions {bazaar {info {input, output}, schema}}}. A v2 service manifest is served at
    /.well-known/x402 (x402Version 2, rails[], resources[13], freeResources[24]) naming the facilitator
    https://facilitator.payai.network. The OpenAPI carries x-payment-info {price, currency USDC,
    network, protocol x402} on all 13 paid operations and skill.md documents the retry with
    PAYMENT-SIGNATURE. A live, complete x402 v2 seller.
- id: mcp-2025-06-18
  conforms: true
  evidence: >-
    POST https://api.flowhomes.eu/mcp initialize -> {protocolVersion "2025-06-18", capabilities {tools
    {}}, serverInfo {qorevia-universal-gateway 3.5.0}, instructions}; tools/list -> 4 tools with JSON
    Schema inputSchema; tools/call qorevia_find -> content[{type text}]; resources/list and
    prompts/list -> JSON-RPC -32601. Streamable HTTP, POST-only (GET 404). Listed in the Official MCP
    Registry with a served /.well-known/mcp-registry-auth ownership proof.
- id: a2a-1.0
  conforms: true
  evidence: >-
    /.well-known/agent-card.json is a 1.0-shaped AgentCard (supportedInterfaces[{url, protocolBinding
    JSONRPC, protocolVersion "1.0"}], capabilities object, skills[10], provider, defaultInput/OutputModes)
    graded conformant in a2a/flowhomes-eu-a2a.yml; the declared endpoint answered message/send with a
    completed Task carrying an artifact, and tasks/get with the A2A -32001 TaskNotFound code.
- id: json-rpc-2.0
  conforms: true
  evidence: Both /mcp and /a2a return well-formed JSON-RPC 2.0 envelopes, including -32601 Method not found for unknown methods and matching ids.
- id: openapi-3.1
  conforms: true
  evidence: >-
    https://api.flowhomes.eu/openapi.json declares openapi 3.1.0 with info, servers[] and 34 paths;
    13 operations carry operationId, tags, parameters/requestBody schemas and response examples. 21
    discovery/club paths carry only a summary and a 200 description (no operationId, no schemas);
    components is empty and no securitySchemes are declared (accurate — there is no API key).
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
