summary: >-
  There is no authentication. openapi/flowhomes-eu-openapi.json declares no securitySchemes and no
  security requirement (derive-authentication.py correctly produced nothing), and that is accurate: the
  provider states "No API key required for paid routes" (agent card, skill qorevia-x402-seller) and
  "There are no accounts". Access control is PAYMENT: each of the 13 priced operations answers an
  unpaid request with HTTP 402 and a PAYMENT-REQUIRED header carrying x402 v2 requirements, and serves
  the response when the same request is retried with a PAYMENT-SIGNATURE header proving a USDC transfer
  on Base Mainnet. The 21 free routes, the MCP server and the A2A endpoint need nothing at all. No
  OAuth, OIDC or RFC 9728 metadata is served (all 404 on api.flowhomes.eu, which is also the MCP host).
