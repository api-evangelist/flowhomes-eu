openapi: 3.2.0
info:
  title: Qorevia Market Intelligence Route API
  version: 2.0.0
  description: Agent-payable market intelligence, data profiling and deterministic utility tools.
  x-guidance: Use these tools for market/session/risk/backtest context and local data profiling. Paid routes use HTTP 402/x402 and settle USDC directly to the provider wallet.
servers:
- url: https://api.flowhomes.eu
tags:
- name: Route
paths:
  /api/route:
    post:
      summary: Free machine-ready call plan for the best matching Qorevia x402 tool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                input:
                  type: object
              required:
              - query
      responses:
        '200':
          description: Route plan
      tags:
      - Route
      operationId: postApiRoute
      x-operation-id-source: derived
