openapi: 3.2.0
info:
  title: Qorevia Market Intelligence Find API
  version: 2.0.0
  description: Agent-payable market intelligence, data profiling and deterministic utility tools.
  x-guidance: Use these tools for market/session/risk/backtest context and local data profiling. Paid routes use HTTP 402/x402 and settle USDC directly to the provider wallet.
servers:
- url: https://api.flowhomes.eu
tags:
- name: Find
paths:
  /api/find:
    get:
      summary: Free natural-language router to the best live Qorevia x402 tool
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 20
      responses:
        '200':
          description: Ranked tool matches
      tags:
      - Find
      operationId: getApiFind
      x-operation-id-source: derived
