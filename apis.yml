apis:
- aid: flowhomes-eu:qorevia-universal-agent-gateway
  name: Qorevia Universal Agent Gateway (MCP + A2A)
  description: >-
    The free discovery and routing layer in front of the paid tools, served from the same origin. MCP:
    https://api.flowhomes.eu/mcp is POST-only Streamable HTTP (GET 404), answers initialize with protocolVersion
    2025-06-18 and serverInfo {qorevia-universal-gateway 3.5.0}, and tools/list anonymously with four
    tools carrying real inputSchemas — qorevia_find, qorevia_route, qorevia_catalog, qorevia_tool_info;
    resources/list and prompts/list return -32601. A tools/call of qorevia_find ("profile csv data") returned
    the csv-profile route plan with price and schema at no cost. Listed in the Official MCP Registry as
    eu.flowhomes.api/qorevia-market-intelligence (3.7.2, published 2026-09-19). A2A: the card at /.well-known/agent-card.json
    (also byte-identical at the legacy /.well-known/agent.json) is 1.0-shaped — supportedInterfaces[]
    {JSONRPC, protocolVersion 1.0, url https://api.flowhomes.eu/a2a}, capabilities object, ten skills
    — and the endpoint is live: a message/send with "Find a tool to profile CSV data" returned a completed
    task whose qorevia-route-plan artifact carried the same csv-profile match; tasks/get returns -32001
    Task not found for unknown ids. Every surface here is free; the tools they route to are x402-paid.
  humanURL: https://api.flowhomes.eu/skill.md
  tags:
  - MCP
  - A2A
  - Agents
  - Tool Discovery
  - x402
  properties:
  - type: MCPServer
    url: mcp/flowhomes-eu-mcp.yml
  - type: MCPServer
    name: Qorevia MCP endpoint (Streamable HTTP, POST-only)
    url: https://api.flowhomes.eu/mcp
  - type: ToolCrosswalk
    url: mcp/flowhomes-eu-tool-crosswalk.yml
  - type: AgentCard
    url: a2a/flowhomes-eu-a2a.yml
  - type: AgentCard
    name: A2A Agent Card (provider-hosted)
    url: https://api.flowhomes.eu/.well-known/agent-card.json
  - type: Documentation
    url: https://api.flowhomes.eu/skill.md
