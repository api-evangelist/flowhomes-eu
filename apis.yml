aid: flowhomes-eu
name: Qorevia
description: >-
  Qorevia ("Qorevia Market Intelligence", operated from api.flowhomes.eu) is an agent-native,
  pay-per-call API seller: thirteen deterministic market-intelligence, data-profiling and developer
  utility tools — live XAUUSD (gold) quote, OHLCV bars and computed market state read from a read-only
  MetaTrader 5 terminal, trading-session state in Europe/Vienna time, stop/target risk levels, a
  strategy robustness grade, tick PnL, OHLCV state, CSV and JSON structural profiling, JWT decode,
  EVM address syntax and regex testing — each priced between $0.0025 and $0.05 and settled per call
  in USDC on Base Mainnet (eip155:8453) through the x402 v2 protocol (HTTP 402 -> pay -> retry with
  PAYMENT-SIGNATURE), with no accounts and no API keys. Discovery is free and unusually complete: an
  OpenAPI 3.1.0 contract at /openapi.json, an x402 manifest at /.well-known/x402, a remote MCP server
  at /mcp (four free finder/router/catalog tools, listed in the Official MCP Registry), an A2A 1.0
  agent card at /.well-known/agent-card.json backed by a live JSON-RPC endpoint at /a2a, a skill.md,
  an llms.txt, a natural-language finder (/api/find) and a "Founders Network" whose tiers derive from
  verified x402 payment history. The registrable domain flowhomes.eu does not serve a website (TLS
  handshake fails; HTTP returns Cloudflare error 1001), so every surface lives on api.flowhomes.eu.
url: https://raw.githubusercontent.com/api-evangelist/flowhomes-eu/refs/heads/main/apis.yml
x-type: company
x-source: harvest:a2a-registry
x-tier: profiled
x-tier-reason: enrichment pass 2026-09-19 (local-v3; was a2a-registry harvest stub)
