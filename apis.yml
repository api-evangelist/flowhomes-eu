apis:
- aid: flowhomes-eu:qorevia-market-intelligence-api
  name: Qorevia Market Intelligence API
  description: >-
    The x402 pay-per-call REST surface, published as OpenAPI 3.1.0 "Qorevia Market Intelligence" 2.0.0
    at https://api.flowhomes.eu/openapi.json (servers https://api.flowhomes.eu; 34 paths). Thirteen
    priced operations carry operationIds and an x-payment-info block (price, USDC, eip155:8453, x402):
    session_state, risk_levels, strategy_grade, xau_quote, xau_bars, xau_market_state, csv_profile,
    json_shape, jwt_decode, tick_pnl, evm_address_syntax, ohlcv_state and regex_test. Each declares
    200 (paid response, with example), 402 (x402 payment required) and 503 (MT5 upstream unavailable —
    "payment is not requested for MT5 routes during preflight failure"). The remaining 21 paths are
    the free discovery, router, beacon and Founders Network routes (no operationIds). Probed
    2026-09-19: an unpaid GET /api/session-state returns HTTP 402 with an empty JSON body and a
    base64 PAYMENT-REQUIRED header decoding to an x402Version 2 envelope (scheme exact, network
    eip155:8453, amount 5000 = $0.005 in USDC 0x8335...2913, payTo 0x80cd...3382, maxTimeoutSeconds
    300, plus a "bazaar" extension carrying the input/output schema). No securitySchemes are declared:
    there is no API key; payment is the credential.
  humanURL: https://api.flowhomes.eu/
  baseURL: https://api.flowhomes.eu
