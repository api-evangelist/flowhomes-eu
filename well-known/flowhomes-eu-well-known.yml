  path_echo_control: passed
  note: >-
    api.flowhomes.eu serves a real A2A agent card (canonical path, and byte-identical at the legacy
    /.well-known/agent.json), an x402 v2 service manifest at /.well-known/x402, four vendor "beacon"
    JSON documents (qorevia-router, -distribution, -magnet, -club), the Official MCP Registry ownership
    proof (mcp-registry-auth) and a 402index verification token, plus /openapi.json, /llms.txt,
    /skill.md, /robots.txt and /sitemap.xml at the root. It serves NO security.txt (RFC 9116), no
    OpenID/OAuth discovery (RFC 8414 / OIDC), no RFC 9728 protected-resource metadata for its MCP
    server (this host IS the MCP host, so these rows are the MCP-host rows), no RFC 9727 api-catalog,
    no ai-plugin.json, no UCP/ACP/AAuth document and no APIs.json. Every miss is a real Express HTML
    404 ("Cannot GET <path>", ~145-195 bytes) — a negative-control path returned the same, so no 200
    below is a catch-all. The registrable domain flowhomes.eu resolves (A 216.24.57.1, a Render
    address; NS internex.at; MX mail.flowhomes.eu) but serves nothing: the TLS handshake on 443 fails
    with an alert (no certificate for this SNI) and plain HTTP returns 409 "error code: 1001" — a
    Cloudflare DNS-resolution error page — so every path on the apex and www is recorded as
    unreachable rather than 404.
