discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: api.flowhomes.eu
  note: >-
    Served from api.flowhomes.eu, which is also the OpenAPI servers[] host, the MCP host
    (https://api.flowhomes.eu/mcp) and the A2A JSON-RPC host (https://api.flowhomes.eu/a2a) — Qorevia
    runs everything on one Caddy-fronted Node/Express origin. The registrable domain flowhomes.eu
    serves nothing (TLS handshake failure on 443; HTTP 409 "error code: 1001" from Cloudflare), so the
    API host is the only host and the card is on the right one. The host has no catch-all: a
    negative-control path under /.well-known/ returned a real Express 404 ("Cannot GET ..."), as did
    security.txt and every OAuth/OIDC discovery path. The legacy /.well-known/agent.json ALSO answers
    200 and is byte-identical to the canonical card (cmp), so it is an alias, not a second document.
    Ownership: the card's provider.organization is "Qorevia" with provider.url https://api.flowhomes.eu;
    the OpenAPI on the same host titles itself "Qorevia Market Intelligence"; the x402 manifest,
    router/magnet/distribution beacons, skill.md, llms.txt and sitemap all cross-reference this exact
    card URL; the Official MCP Registry entry eu.flowhomes.api/qorevia-market-intelligence names the
    same websiteUrl. The lead came from a2aregistry.org (415 agents fetched 2026-09-19, author
    "Qorevia"); the card was fetched directly from the provider's host.
